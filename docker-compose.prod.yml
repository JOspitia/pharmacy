# Override para produccion.
#
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Que cambia respecto a docker-compose.yml:
#   - sin bind mounts: el codigo queda dentro de la imagen.
#   - el contenedor NO ejecuta `migrate --seed` automaticamente en cada
#     arranque: eso debe ser un paso del deploy, no del runtime.
#   - command explicito para php artisan serve sin watcher.

services:
  backend:
    # Reconstruye la imagen con el Dockerfile de produccion, sin source
    # bind mounts.
    build:
      context: ./back
      dockerfile: Dockerfile
    # Sin volumes para app/ - el codigo esta baked in.
    command: >
      sh -c "
        until php -r 'exit(@fsockopen(getenv(\"DB_HOST\"), (int) getenv(\"DB_PORT\")) ? 0 : 1);' 2>/dev/null; do
          echo 'Esperando a la base de datos...'; sleep 2;
        done &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan view:cache &&
        exec php artisan serve --host=0.0.0.0 --port=8000
      "
