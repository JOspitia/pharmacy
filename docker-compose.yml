# Orquestacion de la prueba tecnica.
#
#   docker compose up --build
#
# Resultado:
#   Frontend  http://localhost:5173
#   Backend   http://localhost:8000
#   SQL Server localhost:1433
#
# La base es SQL Server 2025. El enunciado acepta PostgreSQL 16 o SQL Server,
# y recomienda SQL Server por el bloqueo de filas y las restricciones CHECK.
#
# NOTA sobre el LIKE: MySQL y SQL Server son insensibles a mayusculas por
# defecto (collations _ci y _CI_AS respectivamente), asi que la busqueda del
# reporte de inventario (HU-02) funciona igual en los dos. El unico motor que
# obliga a usar ILIKE es PostgreSQL. Ver README, supuesto 1.

services:
  db:
    # SQL Server 2025, la misma version que la instancia local SQLEXPRESS
    # (17.0.1000.7). Se alinea el contenedor con la maquina para que no haya
    # diferencias de comportamiento entre quien levanta el stack con Docker y
    # quien lo levanta contra el servidor instalado en el equipo.
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: pharmacy-db
    restart: unless-stopped
    environment:
      # SQL Server no arranca sin aceptar la licencia, a diferencia de MySQL.
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # La contrasena de sa debe cumplir complejidad: mayuscula, minuscula,
      # digito y simbolo. SQL Server rechaza las debiles con un error poco
      # descriptivo al arrancar.
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      # 1434 en el host, 1433 dentro del contenedor.
      #
      # El equipo de desarrollo tiene una instancia SQL Server Express local
      # escuchando en 1433, y cuando dos procesos piden el mismo puerto en la
      # misma direccion Windows le concede el primero que se registro. El
      # servicio local gana, y cualquier cliente que se conecte a localhost:1433
      # aterriza en la instancia local en vez de en la del contenedor, con un
      # error de autenticacion que no dice nada del conflicto de puertos.
      #
      # Publicar en 1434 evita el choque. La aplicacion no se ve afectada:
      # dentro de la red de Docker el backend sigue hablando con el servicio
      # "db" por su puerto interno 1433, que es lo que dice DB_PORT en
      # .env.docker. Solo cambia como se llega desde el host.
      - "1434:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      # sqlcmd18 exige -C para confiar el certificado autofirmado que genera
      # el contenedor. Sin -C falla el handshake.
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 30
      # SQL Server tarda bastante mas en arrancar que MySQL: la primera vez
      # inicializa la base del sistema.
      start_period: 90s
    networks:
      - pharmacy

  # SQL Server no tiene el punto de extension /docker-entrypoint-initdb.d que
  # usa la imagen de MySQL, asi que la base de pruebas se crea con un
  # servicio de un solo uso que corre una vez y termina.
  #
  # Existe porque las pruebas usan RefreshDatabase, que ejecuta migrate:fresh.
  # Si apuntaran a la base de la aplicacion, cada corrida borraria los datos
  # de trabajo y el usuario administrador.
  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: pharmacy-db-init
    depends_on:
      db:
        condition: service_healthy
    # MISMAS variables que en db. El servicio necesita ACCEPT_EULA para arrancar
    # y MSSQL_SA_PASSWORD para autenticarse: sin esta variable el sqlcmd falla
    # con "Login failed for user 'sa'", que no dice nada sobre la causa.
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    networks:
      - pharmacy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        # SQL Server no crea ninguna base por su cuenta: la imagen de MySQL lo
        # hacia con MYSQL_DATABASE, y aca hay que hacerlo a mano. Se crean las
        # dos, la de la aplicacion y la de pruebas, porque RefreshDatabase
        # ejecuta migrate:fresh y no sirve apuntar a la misma base.
        # Las variables del shell se escapan con doble signo: Compose las
        # interpola antes de enviar el script al contenedor, y con un solo signo
        # el script llega con el nombre vacio (por eso antes imprimia
        # "Base  verificada"). Compose tambien interpola dentro de los
        # comentarios, asi que ni el nombre de la variable puede aparecer sin
        # escapar en uno.
        for BD in farmacia farmacia_testing; do
            /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C \
              -Q "IF DB_ID('$$BD') IS NULL CREATE DATABASE $$BD;"
            echo "Base $$BD verificada."
        done

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: pharmacy-backend
    restart: unless-stopped
    env_file:
      - ./back/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - pharmacy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmacy-frontend
    restart: unless-stopped
    environment:
      # Destino del proxy de /api. Dentro de la red de Docker el backend no es
      # localhost sino el nombre del servicio.
      VITE_API_TARGET: "http://backend:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - pharmacy

volumes:
  db_data:
    driver: local

networks:
  pharmacy:
    driver: bridge