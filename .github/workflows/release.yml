name: Release

# Solo se ejecuta cuando se publica un tag de version.
# Los pushes normales a main NO construyen Docker.
#
# Uso:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN es de SOLO LECTURA por defecto. Sin este bloque:
#   - docker push a ghcr.io falla con 403 Forbidden
#   - softprops/action-gh-release falla al crear el Release
# Se declara lo minimo necesario y nada mas.
permissions:
  contents: write   # Crear el Release y adjuntar el tag
  packages: write   # Publicar imagenes en ghcr.io

jobs:
  build:
    name: Construir imagenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      # Cache de Docker entre builds: si no cambia una capa, no se reconstruye.
      # Con BuildKit el cache se guarda en el runner, pero entre runs se pierde.
      # Con GHA cache se persiste.
      - name: Configurar Buildx con cache
        uses: docker/setup-buildx-action@v3

      - name: Cache de Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-buildx-${{ github.sha }}
          restore-keys: |
            docker-buildx-

      # ---------------------------------------------------------------------------
      # Construir la imagen del backend.
      # ---------------------------------------------------------------------------
      - name: Construir imagen backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: false  # No publicar todavia: solo validar que compila
          tags: pharmacy-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------------
      # Smoke test: levantar el stack completo con la imagen recien construida.
      # ---------------------------------------------------------------------------
      - name: Levantar el stack
        run: |
          docker compose up -d --build
          echo "Stack levantado"

      - name: Verificar liveness
        run: |
          listo=false
          for i in $(seq 1 60); do
            respuesta=$(curl -s http://localhost:8000/api/health || echo '')
            if [ "$respuesta" = '{"status":"ok"}' ]; then
              echo "Backend vivo (intento $i)"
              listo=true
              break
            fi
            echo "Esperando backend... intento $i"
            sleep 5
          done
          if [ "$listo" != "true" ]; then
            echo "Backend no respondio a tiempo"
            docker compose logs backend --tail 50
            exit 1
          fi

      - name: Verificar readiness
        run: |
          respuesta=$(curl -s http://localhost:8000/api/ready)
          echo "$respuesta"
          if ! echo "$respuesta" | grep -q '"database":"connected"'; then
            echo "/ready: base desconectada"
            docker compose logs db --tail 30
            exit 1
          fi
          echo "Readiness OK"

      - name: Verificar login
        run: |
          respuesta=$(curl -s -X POST http://localhost:8000/api/login \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"name":"admin","password":"password"}')
          echo "$respuesta"
          case "$respuesta" in
            *'"token"'*) echo "Login OK" ;;
            *) echo "Login sin token"; exit 1 ;;
          esac

      - name: Logs en fallo
        if: failure()
        run: docker compose logs backend --tail 100

      - name: Apagar el stack
        if: always()
        run: docker compose down -v

      # ---------------------------------------------------------------------------
      # Publicar en GitHub Container Registry (ghcr.io).
      # Requiere el paquete publico o el scope write:packages.
      # ---------------------------------------------------------------------------
      - name: Publicar en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Imagenes publicadas

            - `ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}`

            Para usar:
            ```
            docker compose pull
            docker compose up -d
            ```