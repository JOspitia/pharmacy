name: CI

# Se ejecuta en cada push a main y en cada Pull Request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo ref si llega una version nueva.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # SQL Server 2022 (la version disponible en GitHub Actions).
      # La imagen gratuita Developer edition esta habilitada por MSSQL_PID.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          # La password debe cumplir complejidad de SQL Server:
          # mayuscula, minuscula, digito, simbolo.
          MSSQL_SA_PASSWORD: 'TestPass1!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestPass1!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    defaults:
      run:
        working-directory: back

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlsrv, sqlsrv, mbstring, bcmath, intl, zip
          coverage: none

      - name: Instalar sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | apt-key add - \
          && curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            > /etc/apt/sources.list.d/mssql.list \
          && apt-get update \
          && ACCEPT_EULA=Y apt-get install -y --no-install-recommends mssql-tools18 unixodbc-dev \
          && ln -s /opt/mssql-tools18/bin/sqlcmd /usr/local/bin/sqlcmd

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # Apuntar a SQL Server del service container.
          php -r "
            \$env = file_get_contents('.env');
            \$env = preg_replace('/^DB_CONNECTION=.*/m', 'DB_CONNECTION=sqlsrv', \$env);
            \$env = preg_replace('/^DB_HOST=.*/m', 'DB_HOST=localhost', \$env);
            \$env = preg_replace('/^DB_PORT=.*/m', 'DB_PORT=1433', \$env);
            \$env = preg_replace('/^DB_DATABASE=.*/m', 'DB_DATABASE=farmacia_testing', \$env);
            \$env = preg_replace('/^DB_USERNAME=.*/m', 'DB_USERNAME=sa', \$env);
            \$env = preg_replace('/^DB_PASSWORD=.*/m', 'DB_PASSWORD=TestPass1!', \$env);
            file_put_contents('.env', \$env);
          "

      - name: Crear base de datos
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass1!' -C \
            -Q "IF DB_ID(N'farmacia_testing') IS NULL CREATE DATABASE farmacia_testing;"

      - name: Verificar sintaxis PHP
        run: |
          errores=0
          while IFS= read -r archivo; do
            php -l "$archivo" > /dev/null || errores=1
          done < <(find app database routes config tests -name '*.php' -type f)
          if [ "$errores" -ne 0 ]; then
            echo "Hay archivos con errores de sintaxis"
            exit 1
          fi
          echo "Sintaxis correcta en todos los archivos PHP"

      - name: Ejecutar pruebas
        run: php artisan test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Analizar codigo (ESLint)
        run: npm run lint

      - name: Construir para produccion
        run: npm run build

  docker:
    name: Docker (imagenes)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      # Validar que el compose no tiene errores de sintaxis.
      - name: Validar configuracion de compose
        run: docker compose config --quiet

      - name: Levantar el stack completo
        run: docker compose up -d --build

      # /health es publico: el balanceador lo llama sin token. Si responde 200
      # con {"status":"ok"}, la imagen esta bien construida.
      - name: Esperar al backend y verificar liveness
        run: |
          listo=false
          for intento in $(seq 1 60); do
            respuesta=$(curl -s http://localhost:8000/api/health || echo '')
            if [ "$respuesta" = '{"status":"ok"}' ]; then
              echo "Backend vivo (intento $intento)"
              listo=true
              break
            fi
            echo "Esperando al backend... intento $intento"
            sleep 5
          done

          if [ "$listo" != "true" ]; then
            echo "El backend no respondio /health a tiempo"
            docker compose logs backend --tail 50
            exit 1
          fi

      # /ready verifica que la DB responda. Solo si /ready da 200 el orquestador
      # puede empezar a mandar trafico.
      - name: Verificar readiness
        run: |
          respuesta=$(curl -s http://localhost:8000/api/ready)
          echo "$respuesta"

          if ! echo "$respuesta" | grep -q '"database":"connected"'; then
            echo "/ready indica que la base no esta conectada"
            docker compose logs db --tail 30
            exit 1
          fi
          echo "Readiness OK: base de datos conectada"

      # Login con las credenciales del seeder. Si devuelve token, el seed sirvio.
      - name: Verificar login
        run: |
          respuesta=$(curl -s -X POST http://localhost:8000/api/login \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"name":"admin","password":"password"}')
          echo "$respuesta"

          case "$respuesta" in
            *'"token"'*) echo "Login correcto: seed aplicado" ;;
            *) echo "El login no devolvio token"; exit 1 ;;
          esac

      - name: Logs del backend en caso de fallo
        if: failure()
        run: docker compose logs backend --tail 100

      # always() para que se limpie aunque un paso anterior falle. Sin esto los
      # contenedores quedan activos en el runner.
      - name: Apagar el stack
        if: always()
        run: docker compose down -v
