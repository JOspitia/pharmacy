name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # backend: service container SQL Server dedicado. Corre en paralelo con
  # frontend. Docker NO se construye aqui: eso pasa solo en releases.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # SQL Server 2022. La imagen Developer es gratuita y no requiere registro.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'TestPass1!'
        ports:
          - 1433:1433
        # El healthcheck NO usa sqlcmd a proposito.
        #
        # La ruta de sqlcmd dentro de la imagen cambio entre versiones
        # (/opt/mssql-tools/ en unas, /opt/mssql-tools18/ en otras). Con la
        # ruta equivocada el comando falla, el contenedor nunca queda healthy,
        # y GitHub imprime "mssql service is starting" indefinidamente sin
        # decir por que. Un chequeo de puerto TCP no depende de ninguna ruta:
        # solo necesita bash, que esta en cualquier imagen Ubuntu.
        options: >-
          --health-cmd="bash -c ':> /dev/tcp/127.0.0.1/1433'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=60s

    defaults:
      run:
        working-directory: back

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlsrv, sqlsrv, mbstring, bcmath, intl, zip
          coverage: none

      - name: Instalar sqlcmd en el runner
        run: |
          # ACCEPT_EULA tiene que estar en el entorno del proceso que
          # instala: sin la variable, apt aborta con un error de dpkg que no
          # menciona la licencia.
          # El runner NO es root: corre como el usuario `runner` con sudo
          # disponible. Escribir en /usr/share/keyrings o en
          # /etc/apt/sources.list.d sin sudo da "Permission denied" y el
          # paso muere en el primer comando.
          #
          # `sudo tee` y no `> archivo` porque la redireccion la abre la shell
          # del usuario sin privilegios; tee escribe como root.
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sed 's|deb \[|deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg |' \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          ACCEPT_EULA=Y sudo -E apt-get install -y --no-install-recommends \
            mssql-tools18 unixodbc-dev

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # Apuntar al service container del runner.
          php -r "
            \$env = file_get_contents('.env');
            \$env = preg_replace('/^DB_CONNECTION=.*/m', 'DB_CONNECTION=sqlsrv', \$env);
            \$env = preg_replace('/^DB_HOST=.*/m', 'DB_HOST=127.0.0.1', \$env);
            \$env = preg_replace('/^DB_PORT=.*/m', 'DB_PORT=1433', \$env);
            \$env = preg_replace('/^DB_DATABASE=.*/m', 'DB_DATABASE=farmacia_testing', \$env);
            \$env = preg_replace('/^DB_USERNAME=.*/m', 'DB_USERNAME=sa', \$env);
            \$env = preg_replace('/^DB_PASSWORD=.*/m', 'DB_PASSWORD=TestPass1!', \$env);
            file_put_contents('.env', \$env);
          "

      - name: Esperar a que SQL Server acepte conexiones
        run: |
          # ANTES de intentar cualquier sqlcmd, incluido el CREATE DATABASE.
          #
          # El flag `healthy` del service container se decide con un chequeo de
          # puerto TCP, que responde apenas el socket abre. La instancia puede
          # tardar unos segundos mas en estar lista para autenticar y ejecutar
          # T-SQL. Si el CREATE va primero, falla con "Login failed" o
          # "server was not found", y el reintento de abajo nunca llega a
          # ejecutarse porque el paso ya murio.
          #
          # 30 intentos x 2s = 60s de margen.
          for i in $(seq 1 30); do
            if /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
                 -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server acepta conexiones (intento $i)"
              exit 0
            fi
            echo "Esperando a SQL Server... intento $i"
            sleep 2
          done
          echo "SQL Server no acepto conexiones en 60s"
          exit 1

      - name: Crear base de datos
        run: |
          # SQL Server no crea bases por su cuenta. A diferencia de MySQL,
          # que lo hace con la variable MYSQL_DATABASE, la imagen arranca vacia
          # y hay que crearlas a mano.
          echo "Creando farmacia_testing..."
          /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
            -Q "IF DB_ID(N'farmacia_testing') IS NULL CREATE DATABASE farmacia_testing;"

          # Verificar que quedo creada. Si el CREATE fallo en silencio, esto
          # avisa con un mensaje claro en vez de dejar que las pruebas fallen
          # despues con "cannot open database".
          /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
            -Q "SELECT name FROM sys.databases WHERE name = 'farmacia_testing'" \
            -h -1 | grep -q farmacia_testing \
            || { echo "La base farmacia_testing no existe"; exit 1; }

          echo "Base farmacia_testing lista"

      - name: Verificar sintaxis PHP
        run: |
          errores=0
          while IFS= read -r archivo; do
            php -l "$archivo" > /dev/null || errores=1
          done < <(find app database routes config tests -name '*.php' -type f)
          if [ "$errores" -ne 0 ]; then
            echo "Hay archivos con errores de sintaxis"
            exit 1
          fi
          echo "Sintaxis OK"

      - name: Ejecutar pruebas
        run: php artisan test

  # ---------------------------------------------------------------------------
  # frontend: no necesita base de datos. Corre en paralelo con backend.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Analizar codigo
        run: npm run lint

      - name: Construir
        run: npm run build
