name: CI

# Se ejecuta en cada push a main y en cada Pull Request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo ref si llega una version nueva.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Solo las extensiones que el proyecto usa de verdad. Sin GD ni
          # others de mas: lo minimo necesario hace el job mas rapido.
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # El runner parte de un checkout limpio, sin .env porque esta en el
      # .gitignore. Sin APP_KEY el middleware EncryptCookies lanza
      # MissingAppKeyException en cuanto una prueba hace una peticion HTTP.
      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verificar sintaxis PHP
        run: |
          errores=0
          while IFS= read -r archivo; do
            php -l "$archivo" > /dev/null || errores=1
          done < <(find app database routes config tests -name '*.php' -type f)
          if [ "$errores" -ne 0 ]; then
            echo "Hay archivos con errores de sintaxis"
            exit 1
          fi
          echo "Sintaxis correcta en todos los archivos PHP"

      - name: Ejecutar pruebas
        run: php artisan test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Analizar codigo (ESLint)
        run: npm run lint

      - name: Construir para produccion
        run: npm run build

  docker:
    name: Docker (imagenes)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      # Los runners de GitHub comparten IP y Docker Hub limita las descargas
      # anonimas con HTTP 429. mirror.gcr.io sirve el mismo contenido sin ese
      # limite. Se imprime la configuracion para saber si quedo aplicada.
      - name: Configurar espejo de imagenes
        run: |
          sudo tee /etc/docker/daemon.json > /dev/null <<'EOF'
          { "registry-mirrors": ["https://mirror.gcr.io"] }
          EOF
          sudo systemctl restart docker
          sleep 3
          docker info | grep -A3 "Registry Mirrors" || echo "AVISO: sin espejo activo"

      - name: Validar configuracion de compose
        run: docker compose config --quiet

      # Docker Hub puede responder 429 incluso con el espejo configurado, asi
      # que la descarga se reintenta antes de construir nada.
      - name: Descargar imagenes base
        run: |
          for intento in 1 2 3 4 5 6; do
            if docker compose pull --quiet; then
              echo "Imagenes descargadas en el intento $intento"
              exit 0
            fi
            echo "Limite de descargas alcanzado, reintento $intento en 30s"
            sleep 30
          done
          echo "No se pudieron descargar las imagenes base tras 6 intentos"
          exit 1

      - name: Levantar el stack completo
        run: docker compose up -d --build

      # El backend espera la base y aplica migraciones y seeders al arrancar.
      - name: Esperar al backend
        run: |
          listo=false
          for intento in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/login || true)
            if [ "$codigo" = "405" ] || [ "$codigo" = "422" ]; then
              echo "El backend responde (HTTP $codigo)"
              listo=true
              break
            fi
            echo "Esperando al backend... intento $intento"
            sleep 5
          done

          if [ "$listo" != "true" ]; then
            echo "El backend no respondio a tiempo"
            exit 1
          fi

      # El login debe devolver un token: sin el AdminUserSeeder no habria
      # forma de entrar y el seed seria un fallo silencioso.
      - name: Verificar login
        run: |
          respuesta=$(curl -s -X POST http://localhost:8000/api/login \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"name":"admin","password":"password"}')
          echo "$respuesta"

          case "$respuesta" in
            *'"token"'*) echo "Login correcto" ;;
            *) echo "El login no devolvio token"; exit 1 ;;
          esac

      - name: Logs del backend en caso de fallo
        if: failure()
        run: docker compose logs backend --tail 100

      - name: Apagar el stack
        if: always()
        run: docker compose down -v