name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # backend: service container SQL Server dedicado. Corre en paralelo con
  # frontend. Docker NO se construye aqui: eso pasa solo en releases.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # SQL Server 2022. La imagen Developer es gratuita y no requiere registro.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'TestPass1!'
        ports:
          - 1433:1433
        # El healthcheck NO usa sqlcmd a proposito.
        #
        # La ruta de sqlcmd dentro de la imagen cambio entre versiones
        # (/opt/mssql-tools/ en unas, /opt/mssql-tools18/ en otras). Con la
        # ruta equivocada el comando falla, el contenedor nunca queda healthy,
        # y GitHub imprime "mssql service is starting" indefinidamente sin
        # decir por que. Un chequeo de puerto TCP no depende de ninguna ruta:
        # solo necesita bash, que esta en cualquier imagen Ubuntu.
        options: >-
          --health-cmd="bash -c ':> /dev/tcp/127.0.0.1/1433'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=60s

    defaults:
      run:
        working-directory: back

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlsrv, sqlsrv, mbstring, bcmath, intl, zip
          coverage: none

      - name: Instalar sqlcmd en el runner
        run: |
          # Tres flags, y cada uno existe por un motivo:
          #
          #   --batch   no preguntar nada, nunca
          #   --no-tty  no abrir /dev/tty. Sin esto gpg falla con
          #             "cannot open '/dev/tty': No such device or address"
          #             porque en GitHub Actions no hay terminal que asignar.
          #             --batch deberia implicarlo, pero el flag explicito deja
          #             la intencion a la vista y no depende de esa implicacion.
          #   --yes     sobreescribir el keyring si ya existe (re-ejecucion).
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --no-tty --yes --dearmor \
                -o /usr/share/keyrings/microsoft-prod.gpg

          # `sudo tee` y no `> archivo`: la redireccion la abre la shell del
          # usuario sin privilegios y da "Permission denied". tee escribe
          # como root.
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sed 's|deb \[|deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg |' \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null

          sudo apt-get update

          # ACCEPT_EULA tiene que estar en el entorno del proceso que instala.
          # Sin la variable, apt aborta con un error de dpkg que no menciona
          # la licencia.
          #
          # NEEDRESTART_MODE=l es lo que evita que este paso tarde 6 minutos.
          #
          # needrestart (dependencia de apt en Ubuntu) revisa despues de cada
          # instalacion que servicios quedaron desactualizados y, por defecto,
          # los REINICIA. En el runner eso dispara
          # `systemctl restart php8.2-fpm.service` sobre una VM completa, y
          # esa llamada se queda colgada varios minutos. El log lo delata:
          #
          #   Setting up mssql-tools18 (18.7.1.1-1) ...
          #   Restarting services...
          #    systemctl restart php8.2-fpm.service
          #   No containers need to be restarted.
          #
          # `l` = list only: informa que habria que reiniciar, pero no lo
          # hace. Para este workflow reiniciar php-fpm del runner no sirve de
          # nada: las pruebas no pasan por php-fpm, corren con el CLI.
          #
          # Medido: la instalacion en si tarda 2-4s. Los minutos eran todos
          # del reinicio.
          NEEDRESTART_MODE=l ACCEPT_EULA=Y sudo -E apt-get install -y \
            --no-install-recommends mssql-tools18 unixodbc-dev

          # Verificar que sqlcmd quedo instalado. Un fallo silencioso aqui
          # aparece 30 segundos despues, en el primer paso que lo invoca,
          # como "No such file or directory" sin relacion con la causa.
          command -v sqlcmd || ls -l /opt/mssql-tools18/bin/sqlcmd

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          # .env hace falta para que key:generate produzca APP_KEY. No se
          # reescriben los valores de base de datos: eso va en el env: del
          # paso que corre las pruebas.
          #
          # El motivo de no editar .env es que el cargador de Laravel es
          # inmutable (ver tests/bootstrap.php): una variable de entorno REAL
          # gana sobre lo que diga el archivo. Reescribir el archivo seria
          # trabajo innecesario que ademas se puede desincronizar.
          cp .env.example .env
          php artisan key:generate --force

      - name: Esperar a que SQL Server acepte conexiones
        run: |
          # ANTES de intentar cualquier sqlcmd, incluido el CREATE DATABASE.
          #
          # El flag `healthy` del service container se decide con un chequeo de
          # puerto TCP, que responde apenas el socket abre. La instancia puede
          # tardar unos segundos mas en estar lista para autenticar y ejecutar
          # T-SQL. Si el CREATE va primero, falla con "Login failed" o
          # "server was not found", y el reintento de abajo nunca llega a
          # ejecutarse porque el paso ya murio.
          #
          # `timeout 10` en cada intento: sin el, un socket que acepta la
          # conexion pero no responde se queda colgado indefinidamente y el
          # timeout-minutes del job es el unico freno.
          #
          # 30 intentos x (10s + 2s) como maximo teorico.
          for i in $(seq 1 30); do
            if timeout 10 /opt/mssql-tools18/bin/sqlcmd \
                 -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
                 -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server acepta conexiones (intento $i)"
              exit 0
            fi
            echo "Esperando a SQL Server... intento $i"
            sleep 2
          done
          echo "SQL Server no acepto conexiones a tiempo"
          exit 1

      - name: Crear base de datos
        run: |
          # SQL Server no crea bases por su cuenta. A diferencia de MySQL,
          # que lo hace con la variable MYSQL_DATABASE, la imagen arranca vacia
          # y hay que crearlas a mano.
          echo "Creando farmacia_testing..."
          timeout 30 /opt/mssql-tools18/bin/sqlcmd \
            -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
            -Q "IF DB_ID(N'farmacia_testing') IS NULL CREATE DATABASE farmacia_testing;"

          # Verificar que quedo creada. Si el CREATE fallo en silencio, esto
          # avisa con un mensaje claro en vez de dejar que las pruebas fallen
          # despues con "cannot open database".
          timeout 20 /opt/mssql-tools18/bin/sqlcmd \
            -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
            -Q "SELECT name FROM sys.databases WHERE name = 'farmacia_testing'" \
            -h -1 | grep -q farmacia_testing \
            || { echo "La base farmacia_testing no existe"; exit 1; }

          echo "Base farmacia_testing lista"

      - name: Verificar sintaxis PHP
        run: |
          errores=0
          while IFS= read -r archivo; do
            php -l "$archivo" > /dev/null || errores=1
          done < <(find app database routes config tests -name '*.php' -type f)
          if [ "$errores" -ne 0 ]; then
            echo "Hay archivos con errores de sintaxis"
            exit 1
          fi
          echo "Sintaxis OK"

      - name: Ejecutar pruebas
        run: php artisan test
        # Estas variables NO van en .env: el cargador de Laravel es inmutable
        # (ver tests/bootstrap.php), asi que una variable real de entorno gana
        # sobre el archivo. Declararlas aca deja la configuracion del CI a la
        # vista en el workflow, en vez de escondida en un script.
        #
        # DB_CONNECTION y DB_DATABASE los fija tests/bootstrap.php y no
        # necesitan estar aca, pero se declaran igual para que el bloque
        # describa la configuracion completa y no haya que abrir otro archivo
        # para saber a que base se conecta.
        env:
          DB_CONNECTION: sqlsrv
          DB_HOST: 127.0.0.1
          DB_PORT: '1433'
          DB_DATABASE: farmacia_testing
          DB_USERNAME: sa
          DB_PASSWORD: TestPass1!

      - name: Diagnostico en caso de fallo
        if: failure()
        run: |
          # Todo con timeout: un paso de diagnostico que cuelga esconde el
          # error original y convierte un fallo de 30s en uno de 15 min.
          echo "=== PHP ==="
          php --version 2>&1 | head -1 || true

          echo "=== Extensiones PHP relevantes ==="
          php -m 2>/dev/null | grep -iE '^(pdo|sqlsrv|pdo_sqlsrv|mbstring|bcmath|intl|zip)$' \
            || echo "(no se encontro ninguna)"

          echo "=== Conexion a la base ==="
          timeout 15 /opt/mssql-tools18/bin/sqlcmd \
            -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
            -Q "SELECT @@VERSION" 2>&1 | head -3 \
            || echo "DB inaccesible, o sqlcmd no quedo instalado"

          echo "=== Bases de datos existentes ==="
          timeout 15 /opt/mssql-tools18/bin/sqlcmd \
            -S 127.0.0.1,1433 -U sa -P 'TestPass1!' -C \
            -Q "SELECT name FROM sys.databases" -h -1 2>&1 | head -10 \
            || echo "no se pudieron listar"

          echo "=== Logs del contenedor SQL Server ==="
          # El service container corre en el mismo daemon de Docker, asi que
          # sus logs son accesibles desde el runner.
          timeout 30 docker logs --tail 40 "${{ job.services.mssql.id }}" 2>&1 \
            | tail -40 || echo "no se pudieron obtener los logs del contenedor"

  # ---------------------------------------------------------------------------
  # frontend: no necesita base de datos. Corre en paralelo con backend.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Analizar codigo
        run: npm run lint

      - name: Construir
        run: npm run build

      - name: Diagnostico en caso de fallo
        if: failure()
        run: |
          echo "=== Node ==="
          node --version 2>&1 || true
          npm --version 2>&1 || true
          echo "=== Dependencias instaladas ==="
          # `ls` y no `npm ls`: si la instalacion fallo, npm ls tambien
          # falla y el diagnostico se pierde.
          ls node_modules 2>/dev/null | wc -l | xargs echo "paquetes en node_modules:"
