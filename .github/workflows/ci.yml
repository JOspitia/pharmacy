name: CI

# Se ejecuta en cada push a main y en cada Pull Request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo ref si llega una version nueva.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    # Sin esto GitHub deja el job hasta 6 horas. El limite evita que una
    # compilacion colgada consuma la cuenta entera.
    timeout-minutes: 10

    # Las pruebas usan MySQL y no SQLite, asi que el job necesita la base
    # levantada. La imagen viene del mismo espejo sin limite de descargas que
    # usa el docker-compose, porque los service containers tambien pasan por
    # Docker Hub y sufrian el mismo HTTP 429.
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # Base exclusiva de pruebas. El job solo corre pruebas, asi que no
          # necesita la base de la aplicacion.
          MYSQL_DATABASE: farmacia_testing
          MYSQL_USER: farmacia
          MYSQL_PASSWORD: farmacia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: back

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Solo las extensiones que el proyecto usa de verdad. Sin GD ni
          # others de mas: lo minimo necesario hace el job mas rapido.
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # El runner parte de un checkout limpio, sin .env porque esta en el
      # .gitignore. Sin APP_KEY el middleware EncryptCookies lanza
      # MissingAppKeyException en cuanto una prueba hace una peticion HTTP.
      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verificar sintaxis PHP
        run: |
          errores=0
          while IFS= read -r archivo; do
            php -l "$archivo" > /dev/null || errores=1
          done < <(find app database routes config tests -name '*.php' -type f)
          if [ "$errores" -ne 0 ]; then
            echo "Hay archivos con errores de sintaxis"
            exit 1
          fi
          echo "Sintaxis correcta en todos los archivos PHP"

      - name: Ejecutar pruebas
        run: php artisan test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Analizar codigo (ESLint)
        run: npm run lint

      - name: Construir para produccion
        run: npm run build

  docker:
    name: Docker (imagenes)
    runs-on: ubuntu-latest
    # Es el job mas lento: descarga imagenes base, construye dos imágenes desde
    # cero porque el runner no tiene caché, levanta el stack y espera al backend.
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      # Docker Hub limita las descargas anonimas por IP y los runners de GitHub
      # Actions comparten IP, asi que un pull directo falla siempre con HTTP
      # 429 y reintentar no sirve de nada. Por eso el compose y los Dockerfiles
      # apuntan a mirrors sin ese tope: public.ecr.aws para MySQL y
      # mirror.gcr.io/library/ para las imagenes base de los builds.
      - name: Validar configuracion de compose
        run: docker compose config --quiet

      - name: Levantar el stack completo
        run: docker compose up -d --build

      # El backend espera la base y aplica migraciones y seeders al arrancar.
      - name: Esperar al backend
        run: |
          listo=false
          for intento in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/login || true)
            if [ "$codigo" = "405" ] || [ "$codigo" = "422" ]; then
              echo "El backend responde (HTTP $codigo)"
              listo=true
              break
            fi
            echo "Esperando al backend... intento $intento"
            sleep 5
          done

          if [ "$listo" != "true" ]; then
            echo "El backend no respondio a tiempo"
            exit 1
          fi

      # El login debe devolver un token: sin el AdminUserSeeder no habria
      # forma de entrar y el seed seria un fallo silencioso.
      - name: Verificar login
        run: |
          respuesta=$(curl -s -X POST http://localhost:8000/api/login \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"name":"admin","password":"password"}')
          echo "$respuesta"

          case "$respuesta" in
            *'"token"'*) echo "Login correcto" ;;
            *) echo "El login no devolvio token"; exit 1 ;;
          esac

      - name: Logs del backend en caso de fallo
        if: failure()
        run: docker compose logs backend --tail 100

      # always() y no solo success: si un paso anterior falla, este tambien se
      # ejecuta. Sin eso el job terminaria dejando contenedores y el volumen
      # activos en el runner.
      - name: Apagar el stack
        if: always()
        run: docker compose down -v